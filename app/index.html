* { box-sizing: border-box; }

.radios input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }

ol.trace { margin: 10px 0 0; padding-left: 22px; }

.art-ref { font-size: .8rem; color: var(--ink-3); white-space: nowrap; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .82rem; color: var(--ink-3); font-weight: 600; }

.s-applies { background: var(--banned-soft); color: var(--banned); }
.s-upcoming { background: var(--accent-soft); color: var(--accent); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.kpi { background: var(--surface-2); border-radius: 12px; padding: 12px; }

      name: typeof a.name === 'string' ? Array.from(a.name).slice(0, 120).join('') : '',
      role: pick(a.role, ROLES, 'deployer'),
      takeover: flag(a.takeover),
      eu: a.eu !== false,
      excluded: pick(a.excluded, EXCLUSIONS, 'none'),
      prohibited: Array.isArray(a.prohibited) ? prohibitionIds.filter(function (id) { return a.prohibited.indexOf(id) >= 0; }) : [],
      annex1: flag(a.annex1),
      annex3: pick(a.annex3, [''].concat(ids(RULES.annex3)), ''),
      derogation: pick(a.derogation, [''].concat(ids(RULES.derogations)), ''),
      profiling: flag(a.profiling),
      interacts: flag(a.interacts),
      generates: flag(a.generates),
      generatedBefore: flag(a.generatedBefore),
      emotionBiocat: flag(a.emotionBiocat),
      deepfake: flag(a.deepfake),
      gpai: pick(a.gpai, GPAI, 'none'),
      gpaiBefore: flag(a.gpaiBefore),
      gpaiOpen: flag(a.gpaiOpen),
      deployerType: pick(a.deployerType, DEPLOYER_TYPES, 'private'),
      workplace: flag(a.workplace),
      turnover: isFinite(turnover) && turnover >= 0 ? Math.min(turnover, 1e7) : 0,
      sme: flag(a.sme)
    };
  }

  // Whole days from one ISO date (YYYY-MM-DD) to another.
  function daysBetween(fromIso, toIso) {
    var f = Date.UTC(+fromIso.slice(0, 4), +fromIso.slice(5, 7) - 1, +fromIso.slice(8, 10));
    var t = Date.UTC(+toIso.slice(0, 4), +toIso.slice(5, 7) - 1, +toIso.slice(8, 10));
    return Math.round((t - f) / 86400000);
  }

  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  // 2027-12-02 -> "2 December 2027".
  function longDate(iso) { return String(+iso.slice(8, 10)) + ' ' + MONTHS[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4); }

  // A real calendar date written as YYYY-MM-DD (so 2026-02-30 is rejected).
  function validIso(s) {
    if (typeof s !== 'string' || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s)) return false;
    var d = new Date(Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)));
    return d.getUTCFullYear() === +s.slice(0, 4) && d.getUTCMonth() === +s.slice(5, 7) - 1 && d.getUTCDate() === +s.slice(8, 10);
  }

  function classify(answersIn, asOfIn) {
    var a = normalise(answersIn);
    var asOf = validIso(asOfIn) ? asOfIn : RULES.checked;
    var trace = [], tags = [];
    var step = function (text, article) { trace.push({ text: text, article: article || '' }); };
    var res = { answers: a, asOf: asOf, inScope: true, route: null, highRisk: false, exempt: false, trace: trace };

    // 1. Scope.
    if (!a.eu) { res.inScope = false; step('The system is not placed on the EU market or put into service there, and its output is not used in the EU.', 'Art 2(1)'); }
    else if (a.excluded === 'military') { res.inScope = false; step('Used exclusively for military, defence or national security purposes, which are excluded.', 'Art 2(3)'); }
    else if (a.excluded === 'research') { res.inScope = false; step('Developed and used only for scientific research, or still in research and testing before being placed on the market.', 'Art 2(6) and (8)'); }
    else if (a.excluded === 'personal' && a.role === 'deployer') { res.inScope = false; step('Used by an individual for purely personal, non-professional purposes, so deployer duties do not apply.', 'Art 2(10)'); }
    else step('In scope: placed on the EU market, put into service there, or used in a way whose output reaches the EU.', 'Art 2(1)');

    var roles = a.role === 'both' ? ['provider', 'deployer'] : [a.role];
    if (!res.inScope) {
      res.tier = 'outOfScope';
      return finish(res, a, roles, ['outOfScope']);
    }

    // 2. Banned practices.
    if (a.prohibited.length) {
      a.prohibited.forEach(function (id) {
        var p = byId(RULES.prohibitions, id);
        step('Banned practice: ' + lower(p.label) + '. Banned from ' + longDate(RULES.dates[p.dateKey].amended) + '.', p.point);
      });
      step('A banned practice cannot be placed on the market, put into service or used in the EU, so the other tests are not run until it is removed.', 'Art 5');
      res.tier = 'prohibited';
      return finish(res, a, roles, ['prohibited']);
    }

    // 3. High-risk: products under Annex I, then the uses listed in Annex III.
    if (a.annex1) {
      res.highRisk = true; res.route = 'annex1';
      step('A product, or a safety component of a product, covered by EU product law in Annex I that needs a third-party conformity assessment, so it is high-risk.', 'Art 6(1)');
    }
    if (a.annex3) {
      var area = byId(RULES.annex3, a.annex3);
      step('Intended for a use listed in Annex III: ' + lower(area.label) + '.', area.point);
      if (a.derogation && a.profiling) {
        step('The exemption for systems that do not pose a significant risk is not available, because the system profiles people.', 'Art 6(3), last subparagraph');
        res.highRisk = true; res.route = 'annex3';
      } else if (a.derogation) {
        var d = byId(RULES.derogations, a.derogation);
        step('Not high-risk under the exemption: ' + lower(d.label) + '. The provider must document this assessment and register the system.', d.point + ', Art 6(4)');
        res.exempt = !res.highRisk;
      } else {
        step('None of the exemptions applies, so it is high-risk.', 'Art 6(2)');
        res.highRisk = true; res.route = 'annex3';
      }
    }
    if (res.highRisk) {
      tags.push('highRisk');
      if (a.takeover && roles.indexOf('provider') < 0) {
        roles = ['provider', 'deployer'];
        step('You put your name on the system, changed it substantially or changed its intended purpose, so you take on the provider\'s duties as well.', 'Art 25(1)');
      }
      step('High-risk rules apply from ' + longDate(RULES.dates[res.route].amended) + ' (originally ' + longDate(RULES.dates[res.route].original) + ', before the Digital Omnibus).', RULES.dates[res.route].basis);
    } else if (res.exempt) tags.push('exempt63');

    // 4. Transparency duties.
    var t = [];
    if (a.interacts && roles.indexOf('provider') >= 0) t.push(['It interacts directly with people.', 'Art 50(1)']);
    if (a.generates && roles.indexOf('provider') >= 0) t.push(['It generates audio, images, video or text' + (a.generatedBefore ? ', and was on the market before 2 August 2026, so marking is due by 2 December 2026.' : '.'), 'Art 50(2)']);
    if (a.emotionBiocat && roles.indexOf('deployer') >= 0) t.push(['You use it for emotion recognition or biometric categorisation.', 'Art 50(3)']);
    if (a.deepfake && roles.indexOf('deployer') >= 0) t.push(['You publish deepfakes, or generated text on matters of public interest.', 'Art 50(4)']);
    t.forEach(function (x) { step('Transparency duty: ' + lower(x[0]), x[1]); });
    if (t.length) tags.push('transparency');

    // 5. General-purpose AI models.
    if (a.gpai !== 'none' && roles.indexOf('provider') >= 0) {
      if (a.gpai === 'systemic') step('You provide a general-purpose AI model with systemic risk (presumed above 10^25 floating-point operations of training compute).', 'Art 51');
      else step('You provide a general-purpose AI model' + (a.gpaiOpen ? ' under a free and open-source licence, so some documentation duties fall away.' : '.'), a.gpaiOpen ? 'Art 53(1), (2)' : 'Art 53(1)');
      if (a.gpaiBefore) step('The model was on the market before 2 August 2025, so it must comply by 2 August 2027.', 'Art 111(3)');
      tags.push(a.gpai === 'systemic' ? 'gpaiSystemic' : 'gpai');
    }

    if (!tags.length) { step('No banned practice, high-risk use, transparency trigger or general-purpose model: minimal risk. Only the AI literacy duty applies.', 'Art 4'); tags.push('minimal'); }
    tags = TIER_ORDER.filter(function (k) { return tags.indexOf(k) >= 0; });   // most serious first
    res.tier = tags[0];
    return finish(res, a, roles, tags);
  }

  function lower(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  // Which obligations follow from the classification, by role, with dates.
  function triggered(trigger, res, a) {
    var area = a.annex3;
    var annex3HR = res.highRisk && res.route === 'annex3';
    switch (trigger) {
      case 'inScope': return res.inScope;
      case 'highRisk': return res.highRisk;
      case 'annex3': return annex3HR;
      case 'highRiskWorkplace': return res.highRisk && a.workplace;
      case 'annex3PublicAuthority': return annex3HR && a.deployerType === 'publicAuthority';
      case 'fria': return annex3HR && area !== 'infrastructure' && (a.deployerType !== 'private' || area === 'credit' || area === 'insurance');
      case 'exempt63': return res.exempt;
      case 'interacts': return a.interacts;
      case 'generates': return a.generates;
      case 'emotionBiocat': return a.emotionBiocat;
      case 'deepfake': return a.deepfake;
      case 'gpai': return a.gpai !== 'none';
      case 'gpaiSystemic': return a.gpai === 'systemic';
      case 'gpaiClosedOrSystemic': return a.gpai !== 'none' && (!a.gpaiOpen || a.gpai === 'systemic');
    }
    return false;
  }

  function dateKeyFor(o, res, a) {
    if (o.id === 't_mark' && a.generatedBefore) return 'transparencyLegacy';
    if (o.id.indexOf('g_') === 0 && a.gpaiBefore) return 'gpaiLegacy';
    if (o.dateKey) return o.dateKey;
    if (o.trigger === 'exempt63') return 'annex3';
    return res.route;
  }

  function finish(res, a, roles, tags) {
    res.roles = roles;
    res.tags = tags;
    res.tierLabel = TIERS[res.tier] + (res.tier === 'highRisk' ? (res.route === 'annex1' ? ' (product under Annex I)' : ' (Annex III use)') : '');
    var obligations = [];
    if (res.tier === 'prohibited') {
      a.prohibited.forEach(function (id) {
        var p = byId(RULES.prohibitions, id);
        obligations.push({ id: 'ban_' + id, role: 'both', article: p.point, text: 'Stop: ' + lower(p.label), dateKey: p.dateKey });
      });
    }
    if (res.inScope) {
      RULES.obligations.forEach(function (o) {
        if (res.tier === 'prohibited' && o.id !== 'literacy') return;
        if (o.role !== 'both' && roles.indexOf(o.role) < 0) return;
        if (!triggered(o.trigger, res, a)) return;
        obligations.push({ id: o.id, role: o.role, article: o.article, text: o.text, dateKey: dateKeyFor(o, res, a) });
      });
    }
    obligations.forEach(function (o) {
      var d = RULES.dates[o.dateKey];
      o.date = d.amended;
      o.originalDate = d.original;
      o.daysUntil = daysBetween(res.asOf, o.date);
      o.status = o.daysUntil <= 0 ? 'applies' : 'upcoming';
    });
    obligations.sort(function (x, y) { return x.date < y.date ? -1 : x.date > y.date ? 1 : 0; });
    res.obligations = obligations;
    var upcoming = obligations.filter(function (o) { return o.status === 'upcoming'; });
    res.nextDeadline = upcoming.length ? { date: upcoming[0].date, dateKey: upcoming[0].dateKey, count: upcoming.filter(function (o) { return o.date === upcoming[0].date; }).length } : null;
    res.penalty = penaltyFor(res, a);
    res.uk = ukNotes(res, a);
    return res;
  }

  // The highest fine tier that could apply, in euros, for the company's turnover.
  function penaltyFor(res, a) {
    var key = res.tier === 'prohibited' ? 'prohibited'
      : (res.highRisk || res.exempt || res.tags.indexOf('transparency') >= 0) ? 'operator'
      : (res.tags.indexOf('gpai') >= 0 || res.tags.indexOf('gpaiSystemic') >= 0) ? 'gpai' : null;
    if (!key) return null;
    var p = RULES.penalties[key];
    var share = p.share * a.turnover * 1e6;
    var smeRule = a.sme && key !== 'gpai';
    return { key: key, article: p.article, amount: p.amount, share: p.share, sme: smeRule, max: Math.round(smeRule ? Math.min(p.amount, share) : Math.max(p.amount, share)) };
  }

  function ukNotes(res, a) {
    var notes = RULES.ukBaseline.slice();
    if (a.annex3) {
      var area = byId(RULES.annex3, a.annex3);
      notes.push('For this use (' + lower(area.label.split(':')[0]) + '), regulators whose remits are likely to be engaged include ' + area.uk.join(', ') + '.');
    }
    if (a.annex1) notes.push(RULES.ukAnnex1);
    if (res.tags.indexOf('transparency') >= 0) notes.push(RULES.ukTransparency);
    return notes;
  }

  var api = {
    RULES: RULES, TIERS: TIERS, TIER_ORDER: TIER_ORDER, ROLES: ROLES, EXCLUSIONS: EXCLUSIONS, GPAI: GPAI, DEPLOYER_TYPES: DEPLOYER_TYPES,
    normalise: normalise, classify: classify, daysBetween: daysBetween, validIso: validIso, longDate: longDate
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  return api;
})();
/* MODEL END */
</script>

<script>
(function () {
  'use strict';
  var M = AiActTriage;
  var R = M.RULES;
  var $ = function (id) { return document.getElementById(id); };

  var PRESETS = {
    shortlister: { name: 'Shortlister: CV screening for a retail chain', role: 'deployer', annex3: 'employment', profiling: true, workplace: true, turnover: 400 },
    helpdesk: { name: 'Helpdesk chatbot on a shop website', role: 'both', interacts: true, generates: true, generatedBefore: true, turnover: 400 },
    moodMonitor: { name: 'Mood monitor for call-centre staff', role: 'deployer', prohibited: ['emotionWork'], workplace: true, turnover: 400 },
    loanEngine: { name: 'Loan decision engine at a credit union', role: 'deployer', annex3: 'credit', profiling: true, turnover: 60, sme: true },
    benefits: { name: 'Benefits eligibility checker for a council', role: 'deployer', annex3: 'publicBenefits', profiling: true, deployerType: 'publicAuthority', turnover: 900 },
    transcript: { name: 'Interview notes tidier', role: 'provider', annex3: 'employment', derogation: 'improve', interacts: false, turnover: 12, sme: true },
    insulin: { name: 'Insulin dosing app (a medical device)', role: 'provider', annex1: true, interacts: true, turnover: 85, sme: true },
    openModel: { name: 'Open-weights language model', role: 'provider', gpai: 'gpai', gpaiOpen: true, generates: true, turnover: 30, sme: true },
    invoices: { name: 'Duplicate invoice detector', role: 'deployer', turnover: 400 }
  };

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'className') e.className = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }

  function longDate(iso) {
    var d = new Date(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10)));
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  }
  function euros(x) {
    if (x >= 1e9) return '€' + (x / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'bn';
    if (x >= 1e6) return '€' + (x / 1e6).toFixed(1).replace(/\.0$/, '') + 'm';
    return '€' + Math.round(x).toLocaleString('en-GB');
  }
  function todayIso() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ---------- Questions ----------
  function radios(name, options, legend) {
    var box = el('div', { className: 'radios', role: 'radiogroup', 'aria-label': legend });
    options.forEach(function (o) {
      box.appendChild(el('label', {}, [el('input', { type: 'radio', name: name, value: o[0] }), el('span', { text: o[1] })]));
    });
    return box;
  }
  function check(id, label, art) {
    return el('label', { className: 'check', for: id }, [el('input', { type: 'checkbox', id: id }), el('span', {}, [label + ' ', art ? el('span', { className: 'art', text: art }) : null])]);
  }
  function select(id, options) {
    var s = el('select', { id: id });
    options.forEach(function (o) { s.appendChild(el('option', { value: o[0], text: o[1] })); });
    return s;
  }
  function q(labelText, control, hint, forId) {
    return el('div', { className: 'q' }, [forId ? el('label', { for: forId, text: labelText }) : el('span', { className: 'label', text: labelText }), control, hint ? el('p', { className: 'hint', text: hint }) : null]);
  }

  function buildQuestions() {
    Object.keys(PRESETS).forEach(function (k) { $('preset').appendChild(el('option', { value: k, text: PRESETS[k].name })); });
    $('preset').insertBefore(el('option', { value: '', text: 'Your own system' }), $('preset').firstChild);
    var body = $('q-body');
    var fs = function (legend, kids) { return el('fieldset', {}, [el('legend', { text: legend })].concat(kids)); };

    body.appendChild(fs('1. About it', [
      q('Name', el('input', { type: 'text', id: 'a-name', maxlength: '120' }), null, 'a-name'),
      q('Your role', radios('role', [['provider', 'Provider'], ['deployer', 'Deployer'], ['both', 'Both']], 'Your role'), 'Provider: develops it or has it developed and markets it under its own name. Deployer: uses it professionally.'),
      check('a-eu', 'Placed on the EU market, used in the EU, or its output is used in the EU', 'Art 2(1)'),
      q('Exclusions', select('a-excluded', [['none', 'None of these'], ['military', 'Only for military, defence or national security'], ['research', 'Only for scientific research, or not yet on the market'], ['personal', 'Personal, non-professional use by an individual']]), null, 'a-excluded'),
      check('a-takeover', 'We put our name on someone else\'s system, changed it substantially, or changed its intended purpose', 'Art 25')
    ]));

    var bans = R.prohibitions.map(function (p) { return check('ban-' + p.id, p.label, p.point); });
    body.appendChild(fs('2. Banned uses', [el('p', { className: 'hint', text: 'Tick any that the system does.' })].concat(bans)));

    body.appendChild(fs('3. High-risk tests', [
      check('a-annex1', 'It is, or is a safety component of, a product under Annex I EU product law (for example a medical device, machinery, a toy or radio equipment) that needs a third-party conformity assessment', 'Art 6(1)'),
      q('Intended use listed in Annex III', select('a-annex3', [['', 'None of these']].concat(R.annex3.map(function (x) { return [x.id, x.label]; }))), null, 'a-annex3'),
      q('Does an exemption apply?', select('a-derogation', [['', 'No, none of these']].concat(R.derogations.map(function (x) { return [x.id, x.label]; }))), 'Art 6(3): only for Annex III uses that do not pose a significant risk.', 'a-derogation'),
      check('a-profiling', 'It profiles people (evaluates personal aspects such as performance, health, behaviour or reliability)', 'Art 6(3)')
    ]));

    body.appendChild(fs('4. Transparency triggers', [
      check('a-interacts', 'Provider: it interacts directly with people, for example a chatbot', 'Art 50(1)'),
      check('a-generates', 'Provider: it generates audio, images, video or text', 'Art 50(2)'),
      check('a-generatedBefore', 'That generator was on the market before 2 August 2026', 'Art 111'),
      check('a-emotionBiocat', 'Deployer: you use emotion recognition or biometric categorisation (where not banned)', 'Art 50(3)'),
      check('a-deepfake', 'Deployer: you publish deepfakes, or generated text on matters of public interest', 'Art 50(4)')
    ]));

    body.appendChild(fs('5. General-purpose AI models', [
      q('Do you provide a general-purpose AI model?', select('a-gpai', [['none', 'No'], ['gpai', 'Yes'], ['systemic', 'Yes, with systemic risk (for example over 10^25 FLOP of training compute)']]), null, 'a-gpai'),
      check('a-gpaiOpen', 'Released under a free and open-source licence', 'Art 53(2)'),
      check('a-gpaiBefore', 'On the market before 2 August 2025', 'Art 111(3)')
    ]));

    body.appendChild(fs('6. Your organisation', [
      q('Type of deployer', select('a-deployerType', [['private', 'Private business'], ['publicAuthority', 'Public authority or body governed by public law'], ['publicService', 'Private body providing public services']]), null, 'a-deployerType'),
      check('a-workplace', 'Used at work, affecting your staff', 'Art 26(7)'),
      q('Worldwide annual turnover (€ million)', el('input', { type: 'number', id: 'a-turnover', min: '0', step: '1', inputmode: 'decimal' }), 'Used only to estimate the maximum fine.', 'a-turnover'),
      check('a-sme', 'An SME or start-up', 'Art 99(6)'),
      q('Check dates as of', el('input', { type: 'date', id: 'a-asof' }), 'Which duties already apply depends on the date.', 'a-asof')
    ]));

    $('preset').addEventListener('change', function () { if (this.value) loadAnswers(PRESETS[this.value]); });
    $('questions').addEventListener('change', function (e) { if (e.target.id !== 'preset') { $('preset').value = ''; render(); } });
    $('questions').addEventListener('input', function (e) { if (e.target.id === 'a-name' || e.target.id === 'a-turnover') render(); });
    $('questions').addEventListener('submit', function (e) { e.preventDefault(); });
    $('a-asof').value = todayIso();
    $('preset').value = 'shortlister';
    loadAnswers(PRESETS.shortlister);
  }

  var BOOLS = ['eu', 'takeover', 'annex1', 'profiling', 'interacts', 'generates', 'generatedBefore', 'emotionBiocat', 'deepfake', 'gpaiOpen', 'gpaiBefore', 'workplace', 'sme'];

  function loadAnswers(raw) {
    var a = M.normalise(raw);
    $('a-name').value = a.name;
    document.querySelectorAll('input[name="role"]').forEach(function (r) { r.checked = r.value === a.role; });
    BOOLS.forEach(function (k) { $('a-' + k).checked = a[k]; });
    ['excluded', 'annex3', 'derogation', 'gpai', 'deployerType'].forEach(function (k) { $('a-' + k).value = a[k]; });
    $('a-turnover').value = a.turnover;
    R.prohibitions.forEach(function (p) { $('ban-' + p.id).checked = a.prohibited.indexOf(p.id) >= 0; });
    render();
  }

  function readAnswers() {
    var role = document.querySelector('input[name="role"]:checked');
    var a = { name: $('a-name').value, role: role ? role.value : 'deployer', turnover: $('a-turnover').value === '' ? 0 : Number($('a-turnover').value) };
    BOOLS.forEach(function (k) { a[k] = $('a-' + k).checked; });
    ['excluded', 'annex3', 'derogation', 'gpai', 'deployerType'].forEach(function (k) { a[k] = $('a-' + k).value; });
    a.prohibited = R.prohibitions.filter(function (p) { return $('ban-' + p.id).checked; }).map(function (p) { return p.id; });
    return a;
  }

  // ---------- Results ----------
  function render() {
    var asOf = M.validIso($('a-asof').value) ? $('a-asof').value : todayIso();
    var res = M.classify(readAnswers(), asOf);
    var tier = $('tier');
    tier.innerHTML = '';
    tier.appendChild(el('span', { className: 'badge t-' + res.tier, text: res.tierLabel }));
    tier.appendChild(el('span', { className: 'muted', text: (res.answers.name || 'This system') + ', as ' + res.roles.join(' and ') }));
    var tags = $('tags');
    tags.innerHTML = '';
    res.tags.filter(function (t) { return t !== res.tier; }).forEach(function (t) { tags.appendChild(el('span', { className: 'tag t-' + t, text: 'Also: ' + M.TIERS[t].toLowerCase() })); });

    var applies = res.obligations.filter(function (o) { return o.status === 'applies'; }).length;
    var kpis = $('kpis');
    kpis.innerHTML = '';
    var kpi = function (k, v, s) { return el('div', { className: 'kpi' }, [el('div', { className: 'k', text: k }), el('div', { className: 'v', text: v }), el('div', { className: 's', text: s })]); };
    kpis.appendChild(kpi('Duties', String(res.obligations.length), applies + ' apply now, as of ' + longDate(res.asOf)));
    kpis.appendChild(kpi('Next deadline', res.nextDeadline ? longDate(res.nextDeadline.date) : 'None', res.nextDeadline ? res.nextDeadline.count + ' more ' + (res.nextDeadline.count === 1 ? 'duty starts' : 'duties start') : 'Everything listed already applies'));
    kpis.appendChild(kpi('Maximum fine', res.penalty ? euros(res.penalty.max) : 'n/a', res.penalty ? (res.penalty.sme ? 'SME: the lower of ' : 'The higher of ') + euros(res.penalty.amount) + ' and ' + Math.round(res.penalty.share * 100) + '% of turnover (' + res.penalty.article + ')' : 'No specific fine tier'));

    var trace = $('trace');
    trace.innerHTML = '';
    res.trace.forEach(function (s) { trace.appendChild(el('li', {}, [s.text + ' ', s.article ? el('span', { className: 'art-ref', text: s.article }) : null])); });

    $('obl-sub').textContent = res.obligations.length ? 'Each duty, who it falls on and when it applies under the amended Act. Dates as of ' + longDate(res.asOf) + '.' : 'No duties under the AI Act.';
    var box = $('obligations');
    box.innerHTML = '';
    if (res.obligations.length) {
      var tb = el('table');
      tb.appendChild(el('thead', {}, [el('tr', {}, ['Duty', 'Who', 'Article', 'Applies from'].map(function (h) { return el('th', { scope: 'col', text: h }); }))]));
      var tbody = el('tbody');
      res.obligations.forEach(function (o) {
        tbody.appendChild(el('tr', {}, [
          el('td', { text: o.text }),
          el('td', { text: o.role === 'both' ? 'All' : o.role.charAt(0).toUpperCase() + o.role.slice(1) }),
          el('td', { className: 'art-ref', text: o.article }),
          el('td', {}, [longDate(o.date) + ' ', el('span', { className: 'status s-' + o.status, text: o.status === 'applies' ? 'applies' : 'in ' + o.daysUntil + ' days' })])
        ]));
      });
      tb.appendChild(tbody);
      box.appendChild(tb);
    }
    var uk = $('uk');
    uk.innerHTML = '';
    res.uk.forEach(function (n) { uk.appendChild(el('li', { text: n })); });
  }

  buildQuestions();
})();
</script>
</body>
</html>
