<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second opinion</title>
<meta name="description" content="A scam-spotting test that measures how well you use an AI checker's advice.">
<style>
:root {
  --bg: #f5f4ef;
  --surface: #ffffff;
  --surface-2: #f0eee7;
  --ink: #1c222b;
  --muted: #586271;
  --line: #dedbd1;
  --accent: #2b55c9;
  --accent-ink: #ffffff;
  --accent-soft: #e6ecfb;
  --scam: #b23a2c;
  --scam-soft: #fbe8e4;
  --genuine: #1d7349;
  --genuine-soft: #e1f3e8;
  --checker: #6a3db3;
  --checker-soft: #efe7fb;
  --warn: #8a5d00;
  --warn-soft: #fbf1d9;
  --focus: #f0b400;
  --shadow: 0 1px 2px rgba(20, 24, 32, 0.06), 0 4px 16px rgba(20, 24, 32, 0.06);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c;
    --surface: #1d2128;
    --surface-2: #252a33;
    --ink: #eceef2;
    --muted: #a3acba;
    --line: #343a45;
    --accent: #7d9cf0;
    --accent-ink: #0f1420;
    --accent-soft: #232d45;
    --scam: #f08a7b;
    --scam-soft: #3b2320;
    --genuine: #6fd19c;
    --genuine-soft: #1c3427;
    --checker: #b99af0;
    --checker-soft: #2e2540;
    --warn: #e8bf62;
    --warn-soft: #3a3020;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 10; }
.skip:focus { top: 8px; }
header.top {
  max-width: 1080px; margin: 0 auto; padding: 18px 20px 6px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.brand { font-weight: 700; letter-spacing: -0.01em; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; display: inline-block; vertical-align: middle; }
.top-note { color: var(--muted); font-size: 0.88rem; }
main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 48px; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.015em; }
h1 { font-size: clamp(2rem, 5vw, 2.8rem); margin: 6px 0 12px; }
h2 { font-size: 1.35rem; margin: 0 0 10px; }
h3 { font-size: 1.05rem; margin: 0 0 8px; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.76rem; font-weight: 700; color: var(--accent); margin: 0; }
.lede { font-size: 1.12rem; max-width: 62ch; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px;
}
.stack > * + * { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { padding: 13px 22px; font-size: 1.05rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.kbd { font: 600 0.78rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; background: var(--surface-2); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: start; }
.step-num { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.step-num.checker { background: var(--checker-soft); color: var(--checker); }
.persona { background: var(--surface-2); border-radius: 12px; padding: 14px 16px; }
.notice { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 14px; border-radius: 8px; }
.notice.warn { border-color: var(--warn); background: var(--warn-soft); }
.error-text { color: var(--scam); font-weight: 600; min-height: 1.5em; margin: 6px 0 0; }
#import-error:empty { min-height: 0; margin: 0; }
.btn.quiet { background: transparent; border-color: transparent; color: var(--accent); padding-left: 10px; padding-right: 10px; text-decoration: underline; text-underline-offset: 3px; }
.btn.quiet:hover { background: var(--accent-soft); }
.secondary-row { margin-top: 6px; gap: 4px; }
.start-row { gap: 16px; }

/* Progress */
.progress { margin: 4px 0 18px; }
.progress-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 0.92rem; color: var(--muted); margin-bottom: 8px; }
.progress-top strong { color: var(--ink); }
.bar { display: grid; gap: 4px; }
.bar-seg { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar-seg > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-seg.checker > span { background: var(--checker); }

/* Messages */
.context { font-size: 0.93rem; background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }
.context b { color: var(--warn); }
.msg { border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.msg-head { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent); }
.msg-meta { min-width: 0; }
.msg-from { font-weight: 700; overflow-wrap: anywhere; }
.msg-addr { font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
.msg-channel { margin-left: auto; font-size: 0.76rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
.msg-subject { padding: 12px 16px 0; font-weight: 700; overflow-wrap: anywhere; }
.msg-body { padding: 12px 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bubble .msg-body { padding: 16px; }
.msg.bubble .bubble-text { display: inline-block; max-width: 100%; background: var(--surface-2); border-radius: 16px 16px 16px 4px; padding: 10px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.link-note { font-size: 0.84rem; color: var(--muted); margin-top: 10px; }

/* Decision panel */
.panel h2 { font-size: 1.15rem; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.choice-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice label {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 64px; border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
  font-weight: 700; font-size: 1.08rem; background: var(--surface); padding: 8px; text-align: center;
}
.choice label .hint { font-weight: 500; font-size: 0.78rem; color: var(--muted); }
.choice input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.choice.scam input:checked + label { border-color: var(--scam); background: var(--scam-soft); color: var(--scam); }
.choice.genuine input:checked + label { border-color: var(--genuine); background: var(--genuine-soft); color: var(--genuine); }
.seg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.seg input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.seg label {
  display: grid; place-items: center; min-height: 44px; border: 2px solid var(--line); border-radius: 10px;
  cursor: pointer; font-weight: 700; font-size: 0.92rem; background: var(--surface);
}
.seg input:checked + label { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.seg input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.seg-ends { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.shortcuts { font-size: 0.82rem; color: var(--muted); margin-top: 12px; }
.first-answer { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.95rem; margin-bottom: 12px; }
.checker-card { border: 2px solid var(--checker); background: var(--checker-soft); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.checker-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--checker); margin-bottom: 6px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
.verdict { font-size: 1.3rem; font-weight: 800; }
.meter { height: 8px; background: var(--surface); border-radius: 99px; overflow: hidden; margin: 6px 0 2px; }
.meter > span { display: block; height: 100%; background: var(--checker); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 0.82rem; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
.chip.scam { background: var(--scam-soft); color: var(--scam); border-color: var(--scam); }
.chip.genuine { background: var(--genuine-soft); color: var(--genuine); border-color: var(--genuine); }
.chip.right { background: var(--genuine-soft); color: var(--genuine); }
.chip.wrong { background: var(--scam-soft); color: var(--scam); }
.chip.neutral { background: var(--surface-2); color: var(--muted); }

/* Results */
.profile-card { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: center; }
.profile-label { font-size: clamp(1.7rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; margin: 4px 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.tile .k { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.tile .v { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; }
.tile .d { font-size: 0.8rem; color: var(--muted); }
.tile.checker .v { color: var(--checker); }
.matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.cell { border-radius: 12px; padding: 14px; border: 1px solid var(--line); background: var(--surface); }
.cell .big { font-size: 1.5rem; font-weight: 800; }
.cell.key { border-width: 2px; }
.cell.good { border-color: var(--genuine); }
.cell.bad { border-color: var(--scam); }
svg text { fill: var(--ink); font-family: inherit; }
svg text.halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.quadrant { max-width: 300px; margin: 0 auto; }
svg .axis { stroke: var(--line); }
svg .muted-text { fill: var(--muted); }
.chart { width: 100%; height: auto; display: block; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); margin-top: 6px; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }
table.data { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data th { color: var(--muted); font-weight: 600; }
details.debrief { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.debrief + details.debrief { margin-top: 8px; }
details.debrief > summary { cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; }
details.debrief > summary::-webkit-details-marker { display: none; }
details.debrief > summary::before { content: "+"; font-weight: 800; color: var(--muted); width: 14px; }
details.debrief[open] > summary::before { content: "\2212"; }
.debrief-body { padding: 0 14px 14px; }
.debrief-body ul { margin: 8px 0 0; padding-left: 20px; }
.pos { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 700; min-width: 2.2em; }
.grow { flex: 1 1 180px; min-width: 0; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.hbars { display: grid; gap: 10px; margin-top: 6px; }
.hbar-row, .db-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); grid-template-areas: "label track" ". value"; column-gap: 12px; row-gap: 2px; align-items: center; }
.hbar-label { grid-area: label; font-size: 0.9rem; font-weight: 600; }
.hbar-track, .db-track { grid-area: track; position: relative; height: 14px; background: var(--surface-2); border-radius: 99px; }
.hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 99px; opacity: 0.55; }
.hbar-fill.checker { background: var(--checker); opacity: 0.85; }
.hbar-fill.final { background: var(--accent); opacity: 1; }
.hbar-value { grid-area: value; font-size: 0.9rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.dumbbells { display: grid; gap: 14px; margin-top: 6px; }
.db-line { position: absolute; top: 6px; height: 2px; background: var(--muted); }
.db-dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; }
.db-dot.acc { background: var(--accent); border-radius: 50%; }
.db-dot.conf { background: var(--warn); transform: rotate(45deg) scale(0.85); }
.settings { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.settings > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
.settings-body { padding: 0 14px 14px; }
.settings legend { font-size: 0.95rem; }
.opt { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.feedback-card { border-radius: 12px; padding: 16px; border: 2px solid var(--line); }
.feedback-card.right { border-color: var(--genuine); background: var(--genuine-soft); }
.feedback-card.wrong { border-color: var(--scam); background: var(--scam-soft); }
.feedback-card h2 { font-size: 1.4rem; }
.fb-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
.fb-cues { margin: 0 0 14px; padding-left: 20px; }
.timeline { list-style: none; padding: 0; margin: 12px 0 4px; display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.tl-cell { display: grid; justify-items: center; gap: 4px; padding: 6px 0; border-radius: 8px; background: var(--surface-2); }
.tl-cell.tl-err { background: var(--scam-soft); }
.tl-cell.tl-first { outline: 2px solid var(--scam); }
.tl-ai { font-weight: 800; font-size: 0.85rem; color: var(--genuine); }
.tl-err .tl-ai { color: var(--scam); }
.tl-you { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--checker); }
.tl-you.switched, .tl-key.switched { background: var(--checker); border: 2px solid var(--checker); }
.tl-you.held, .tl-key.held { background: transparent; border: 2px solid var(--checker); }
.tl-you.agreed, .tl-key.agreed { background: var(--line); border: 2px solid var(--line); }
.tl-key { border-radius: 50%; }
.tl-key-x { color: var(--scam); font-weight: 800; }
.hbar-row.wide { grid-template-columns: 230px minmax(0, 1fr); }
.notice.resume, .notice.example { margin-bottom: 12px; }
.notice.example { border-color: var(--checker); background: var(--checker-soft); }
.all-rules { margin-top: 12px; }
.all-rules > summary { cursor: pointer; font-weight: 600; }
.scroll { overflow-x: auto; }
tr.best td { font-weight: 700; }
table.data td:nth-child(n+2) { white-space: nowrap; }
@media (pointer: coarse) { .choice label .hint, .shortcuts { display: none; } }
footer.foot { max-width: 1080px; margin: 0 auto; padding: 0 20px 32px; color: var(--muted); font-size: 0.85rem; }

@media (max-width: 860px) {
  .grid-2, .profile-card { grid-template-columns: minmax(0, 1fr); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles .tile:last-child { grid-column: span 2; }
  .grid-3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 480px) {
  .hbar-row, .hbar-row.wide, .db-row { grid-template-columns: minmax(0, 1fr); grid-template-areas: "label" "track" "value"; }
  main { padding: 4px 14px 40px; }
  header.top { padding: 14px 14px 4px; }
  .card { padding: 16px; }
  .matrix { grid-template-columns: minmax(0, 1fr); }
  .seg label { font-size: 0.82rem; }
  .msg-channel { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .fade-in { animation: fade 0.25s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>
</head>

        return '<label class="opt"><input type="radio" name="advice-style" value="' + v + '"' + (c.advice === v ? ' checked' : '') + '> ' + esc(ADVICE_LABELS[v]) + '</label>';
      }).join('') + '</fieldset>' +
      '<label class="opt"><input type="checkbox" id="feedback-toggle"' + (c.feedback ? ' checked' : '') + '> Show the right answer after each checker message</label>' +
      '<p class="small muted">Showing a reason can make people trust advice more, including wrong advice. Feedback lets them learn when the checker is reliable. Random assignment lets you compare groups fairly: pool everyone\'s results files with the Python toolkit.</p>' +
      '</div></details>';
  }

  function renderPhase() {
    var phase = current().phase;
    var info = PHASE_INFO[phase];
    var extra = '';
    if (phase === 'with') {
      extra = '<div class="notice"><strong>How the checker shows its advice:</strong> ' +
        (state.session.condition.advice === 'verdict' ? 'just its verdict.' :
          state.session.condition.advice === 'confidence' ? 'its verdict and how confident it is.' :
            'its verdict, how confident it is, and its reason.') +
        (state.session.condition.feedback ? ' After each message you will see the right answer, so you can learn when to trust it.' : '') + '</div>';
    }
    app.innerHTML =
      '<section class="card stack fade-in" style="max-width: 680px">' +
        '<p class="eyebrow">Part ' + info.number + ' of 3</p>' +
        '<h1 id="phase-title" tabindex="-1">' + esc(info.title) + '</h1>' +
        '<p class="lede">' + esc(info.intro) + '</p>' + extra +
        '<div class="btn-row"><button class="btn primary big" type="button" data-action="begin">Begin part ' + info.number + '</button></div>' +
      '</section>';
    focusFirst('phase-title');
  }

  function renderMessage(item, headingId, headingText) {
    var bubble = item.channel === 'sms' || item.channel === 'chat' || item.channel === 'dm';
    var initial = item.from.replace(/[^A-Za-z0-9+@]/g, '').charAt(0) || '?';
    if (initial === '+') { initial = '#'; }
    var html = '';
    if (item.context) {
      html += '<div class="context"><b>What you know:</b> ' + esc(item.context) + '</div>';
    }
    html += '<article class="msg' + (bubble ? ' bubble' : '') + '" data-item="' + esc(item.id) + '"' + (headingId ? ' aria-labelledby="' + headingId + '"' : '') + '>';
    if (headingId) { html += '<h2 id="' + headingId + '" tabindex="-1" class="visually-hidden">' + esc(headingText) + '</h2>'; }
    html += '<div class="msg-head"><span class="avatar" aria-hidden="true">' + esc(initial.toUpperCase()) + '</span>' +
      '<div class="msg-meta"><div class="msg-from">' + esc(item.from) + '</div>' +
      (item.address ? '<div class="msg-addr">' + esc(item.address) + '</div>' : '') + '</div>' +
      '<span class="msg-channel">' + esc(CHANNEL_LABEL[item.channel]) + '</span></div>';
    if (item.subject) { html += '<div class="msg-subject">' + esc(item.subject) + '</div>'; }
    html += bubble ? '<div class="msg-body"><span class="bubble-text">' + esc(item.body) + '</span></div>'
      : '<div class="msg-body">' + esc(item.body) + '</div>';
    html += '</article>';
    return html;
  }

  function choiceFieldset(legend, name, selected) {
    return '<fieldset id="fs-' + name + '"><legend>' + esc(legend) + '</legend><div class="choice-row">' +
      ['scam', 'genuine'].map(function (v) {
        var id = name + '-' + v;
        return '<div class="choice ' + v + '"><input type="radio" name="' + name + '" id="' + id + '" value="' + v + '"' +
          (selected === v ? ' checked' : '') + '><label for="' + id + '">' + word(v) +
          '<span class="hint" aria-hidden="true">Press ' + (v === 'scam' ? 'S' : 'G') + '</span></label></div>';
      }).join('') + '</div></fieldset>';
  }

  function confidenceFieldset(legend, selected) {
    return '<fieldset id="fs-confidence"><legend>' + esc(legend) + '</legend><div class="seg">' +
      M.CONFIDENCE_LEVELS.map(function (c) {
        var id = 'conf-' + c;
        return '<span><input type="radio" name="confidence" id="' + id + '" value="' + c + '"' +
          (selected === c ? ' checked' : '') + '><label for="' + id + '">' + c + '%</label></span>';
      }).join('') + '</div><div class="seg-ends" aria-hidden="true"><span>50%: a pure guess</span><span>100%: certain</span></div></fieldset>';
  }

  function renderTrial() {
    var trial = current();
    var item = M.ITEM_BY_ID[trial.item];
    var info = PHASE_INFO[trial.phase];
    var inPhase = phaseIndex(trial);
    var total = phaseCount(trial.phase);
    var progress = '<div class="progress">' +
      '<div class="progress-top"><span><strong>Part ' + info.number + ' of 3:</strong> ' + esc(info.title) + '</span>' +
      '<span>Message ' + inPhase + ' of ' + total + '</span></div><div class="bar" aria-hidden="true" style="grid-template-columns: 6fr 16fr 6fr">' +
      M.PHASES.map(function (p) {
        var n = phaseCount(p);
        var done = trials().filter(function (t) { return t.phase === p && M.isComplete(t); }).length;
        return '<div class="bar-seg' + (p === 'with' ? ' checker' : '') + '"><span style="width:' + (100 * done / n) + '%"></span></div>';
      }).join('') + '</div></div>';

    var heading = 'Message ' + inPhase + ' of ' + total + ' in part ' + info.number + ': ' +
      CHANNEL_LABEL[item.channel].toLowerCase() + ' from ' + item.from;
    var panel;
    var isFinal = state.stage === 'final';
    if (state.stage === 'feedback') {
      var yourRight = trial.final.answer === trial.truth;
      var aiRight = trial.ai.verdict === trial.truth;
      panel = '<div class="feedback-card ' + (yourRight ? 'right' : 'wrong') + '">' +
        '<h2 id="feedback-title" tabindex="-1">' + (trial.truth === 'scam' ? 'This was a scam' : 'This was genuine') + '</h2>' +
        '<p class="fb-line">You said ' + answerChip(trial.final.answer) + ' <strong>' + (yourRight ? 'You were right.' : 'You were wrong.') + '</strong></p>' +
        '<p class="fb-line">The checker said ' + answerChip(trial.ai.verdict) + ' <strong>' + (aiRight ? 'It was right.' : 'It was wrong.') + '</strong></p>' +
        '<p class="small" style="margin: 10px 0 4px"><strong>' + (trial.truth === 'scam' ? 'Warning signs' : 'Why it is genuine') + '</strong></p>' +
        '<ul class="small fb-cues">' + item.cues.map(function (cue) { return '<li>' + esc(cue) + '</li>'; }).join('') + '</ul>' +
        '<button class="btn primary big" type="button" data-action="next">' + (state.index === trials().length - 1 ? 'Finish and see results' : 'Next message') + '</button></div>';
    } else if (!isFinal) {
      var label = trial.phase === 'with' ? 'Ask the checker' : (state.index === trials().length - 1 ? 'Finish and see results' : 'Next message');
      panel = '<h2 class="visually-hidden">Your answer</h2>' +
        '<form id="answer-form" novalidate>' +
        choiceFieldset('Is this a scam?', 'answer', null) +
        confidenceFieldset('How sure are you?', null) +
        '<p class="error-text" id="form-error" role="alert"></p>' +
        '<button class="btn primary big" type="submit">' + label + '</button>' +
        '<p class="shortcuts">Shortcuts: <span class="kbd">S</span> scam, <span class="kbd">G</span> genuine, <span class="kbd">1</span> to <span class="kbd">6</span> how sure, <span class="kbd">Enter</span> to continue.</p>' +
        '</form>';
    } else {
      var style = state.session.condition.advice;
      var ai = trial.ai;
      var reason = item.ai.reason;
      panel = '<div class="first-answer">Your first answer: ' + answerChip(trial.initial.answer) +
        '<span class="muted">' + trial.initial.confidence + '% sure</span></div>' +
        '<div class="checker-card" role="group" aria-labelledby="checker-title">' +
          '<div class="checker-title" id="checker-title" tabindex="-1">The checker says</div>' +
          '<div class="verdict" style="color: var(--' + ai.verdict + ')">' + word(ai.verdict) + '</div>' +
          (style !== 'verdict' ? '<div class="meter" aria-hidden="true"><span style="width:' + ai.confidence + '%"></span></div>' +
            '<div class="small">' + ai.confidence + '% confident</div>' : '') +
          (style === 'reason' ? '<p class="small" style="margin: 8px 0 0">' + esc(reason) + '</p>' : '') +
        '</div>' +
        '<form id="answer-form" novalidate>' +
        choiceFieldset('Your final answer', 'answer', trial.initial.answer) +
        confidenceFieldset('How sure are you now?', trial.initial.confidence) +
        '<p class="error-text" id="form-error" role="alert"></p>' +
        '<button class="btn primary big" type="submit">' + (state.index === trials().length - 1 ? 'Finish and see results' : 'Confirm final answer') + '</button>' +
        '</form>';
    }
    app.innerHTML = progress + '<div class="grid-2 fade-in">' +
      '<section>' + renderMessage(item, 'msg-heading', heading) + '</section>' +
      '<section class="card panel" aria-label="Your answer">' + panel + '</section></div>';
    state.shownAt = performance.now();
    if (state.stage === 'feedback') {
      announce((trial.truth === 'scam' ? 'This was a scam. ' : 'This was genuine. ') + 'You were ' +
        (trial.final.answer === trial.truth ? 'right' : 'wrong') + '. The checker was ' + (trial.ai.verdict === trial.truth ? 'right.' : 'wrong.'));
      focusFirst('feedback-title');
    } else if (isFinal) {
      var aiText = 'The checker says ' + word(trial.ai.verdict) +
        (state.session.condition.advice !== 'verdict' ? ', ' + trial.ai.confidence + '% confident' : '') + '.';
      announce(aiText);
      focusFirst('checker-title');
    } else {
      focusFirst('msg-heading');
    }
  }

  /* ---------- Results ---------- */

  function bars(rows, wide) {
    return '<div class="hbars">' + rows.map(function (r) {
      var w = r.value === null ? 0 : Math.round(r.value * 100);
      return '<div class="hbar-row' + (wide ? ' wide' : '') + '"><div class="hbar-label">' + esc(r.label) + '</div>' +
        '<div class="hbar-track" aria-hidden="true"><span class="hbar-fill ' + (r.cls || '') + '" style="width:' + w + '%"></span></div>' +
        '<div class="hbar-value">' + (r.value === null ? 'n/a' : w + '%') + '<span class="muted small"> ' + esc(r.detail || '') + '</span></div></div>';
    }).join('') + '</div>';
  }

  function quadrant(rair, rsr) {
    var size = 260, pad = 34, inner = size - pad - 10;
    function x(v) { return pad + v * inner; }
    function y(v) { return 10 + (1 - v) * inner; }
    var mid = 0.5;
    var svg = '<svg class="chart" viewBox="0 0 ' + size + ' ' + (size + 6) + '" role="img" aria-labelledby="quad-title quad-desc">' +
      '<title id="quad-title">Where you sit on the reliance map</title>' +
      '<desc id="quad-desc">' + esc(quadrantDescription(rair, rsr)) + '</desc>' +
      '<rect x="' + x(mid) + '" y="' + y(1) + '" width="' + (inner / 2) + '" height="' + (inner / 2) + '" fill="var(--genuine-soft)"/>' +
      '<rect x="' + x(0) + '" y="' + y(mid) + '" width="' + (inner / 2) + '" height="' + (inner / 2) + '" fill="var(--scam-soft)"/>' +
      '<rect x="' + x(0) + '" y="' + y(1) + '" width="' + inner + '" height="' + inner + '" fill="none" class="axis" stroke-width="1"/>' +
      '<line x1="' + x(mid) + '" x2="' + x(mid) + '" y1="' + y(0) + '" y2="' + y(1) + '" class="axis" stroke-dasharray="3 3"/>' +
      '<line x1="' + x(0) + '" x2="' + x(1) + '" y1="' + y(mid) + '" y2="' + y(mid) + '" class="axis" stroke-dasharray="3 3"/>' +
      '<text x="' + (x(0.75)) + '" y="' + (y(0.87)) + '" text-anchor="middle" font-size="10" class="muted-text halo">Calibrated</text>' +
      '<text x="' + (x(0.25)) + '" y="' + (y(0.87)) + '" text-anchor="middle" font-size="10" class="muted-text halo">Under-reliant</text>' +
      '<text x="' + (x(0.75)) + '" y="' + (y(0.1)) + '" text-anchor="middle" font-size="10" class="muted-text halo">Over-reliant</text>' +
      '<text x="' + (x(0.25)) + '" y="' + (y(0.1)) + '" text-anchor="middle" font-size="10" class="muted-text halo">Second-guesser</text>' +
      '<text x="' + x(0.5) + '" y="' + (size + 2) + '" text-anchor="middle" font-size="10.5">Took good advice</text>' +
      '<text transform="translate(12 ' + y(0.5) + ') rotate(-90)" text-anchor="middle" font-size="10.5">Resisted bad advice</text>' +
      '<text x="' + x(0) + '" y="' + (y(0) + 13) + '" font-size="9" class="muted-text" text-anchor="middle">0%</text>' +
      '<text x="' + x(1) + '" y="' + (y(0) + 13) + '" font-size="9" class="muted-text" text-anchor="middle">100%</text>' +
      '<text x="' + (x(0) - 4) + '" y="' + (y(1) + 4) + '" font-size="9" class="muted-text" text-anchor="end">100%</text>';
    if (rair !== null && rsr !== null) {
      svg += '<circle cx="' + x(rair) + '" cy="' + y(rsr) + '" r="9" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>';
    } else if (rair !== null) {
      svg += '<line x1="' + x(rair) + '" x2="' + x(rair) + '" y1="' + y(0) + '" y2="' + y(1) + '" stroke="var(--accent)" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>';
    } else if (rsr !== null) {
      svg += '<line x1="' + x(0) + '" x2="' + x(1) + '" y1="' + y(rsr) + '" y2="' + y(rsr) + '" stroke="var(--accent)" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>';
    }
    return svg + '</svg>';
  }

  function quadrantDescription(rair, rsr) {
    if (rair === null && rsr === null) { return 'No position: you never disagreed with the checker.'; }
    if (rair === null) { return 'Resisted bad advice ' + pct(rsr) + ' of the time. Taking good advice could not be measured, so you sit somewhere along a horizontal line.'; }
    if (rsr === null) { return 'Took good advice ' + pct(rair) + ' of the time. Resisting bad advice could not be measured, so you sit somewhere along a vertical line.'; }
    return 'Took good advice ' + pct(rair) + ' of the time and resisted bad advice ' + pct(rsr) + ' of the time.';
  }

  function complementarityText(s) {
    var a = s.accuracy;
    if (a.withFinal === null) { return ''; }
    var best = Math.max(a.withInitial, a.checker);
    var who = a.checker > a.withInitial ? 'the checker alone' : (a.checker < a.withInitial ? 'your own first answers' : 'either of you alone');
    if (s.complementarity > 0) {
      return 'Together you beat both of you alone: your final answers were ' + pct(a.withFinal) + ' right, ' + points(s.complementarity) + ' above ' + who + '.';
    }
    if (s.complementarity === 0) {
      return 'Your final answers (' + pct(a.withFinal) + ') matched ' + who + ', so working together added nothing on top of the better of you.';
    }
    return 'Your final answers (' + pct(a.withFinal) + ') were below ' + who + ' (' + pct(best) + '). Working together made the result worse than the better of you on your own.';
  }

  function dumbbells(conf) {
    var rows = [
      ['Part 1, on your own', conf.before],
      ['Part 2, first answers', conf.withInitial],
      ['Part 2, final answers', conf.withFinal],
      ['Part 3, on your own', conf.after]
    ].filter(function (r) { return r[1].n > 0; });
    return '<div class="dumbbells">' + rows.map(function (r) {
      var c = r[1];
      var lo = Math.min(c.accuracy, c.meanConfidence) * 100, hi = Math.max(c.accuracy, c.meanConfidence) * 100;
      var over = c.overconfidence;
      var note = Math.abs(over) < 0.05 ? 'well calibrated' : (over > 0 ? 'overconfident by ' + Math.round(over * 100) : 'underconfident by ' + Math.round(-over * 100));
      return '<div class="db-row"><div class="hbar-label">' + esc(r[0]) + '</div>' +
        '<div class="db-track" aria-hidden="true"><span class="db-line" style="left:' + lo + '%; width:' + (hi - lo) + '%"></span>' +
        '<span class="db-dot acc" style="left:' + (c.accuracy * 100) + '%"></span>' +
        '<span class="db-dot conf" style="left:' + (c.meanConfidence * 100) + '%"></span></div>' +
        '<div class="hbar-value">' + pct(c.accuracy) + ' right, ' + pct(c.meanConfidence) + ' sure <span class="muted small">(' + note + ')</span></div></div>';
    }).join('') + '</div>' +
      '<div class="legend"><span><span class="swatch" style="background: var(--accent); border-radius: 50%"></span>Share right</span>' +
      '<span><span class="swatch" style="background: var(--warn); transform: rotate(45deg)"></span>Average confidence</span></div>';
  }

  function renderResults() {
    var session = state.session;
    var s = M.score(session);
    var r = s.reliance, c = r.cells, a = s.accuracy;
    var p = s.profile;
    var decisive = c.checkerRight.n + c.checkerWrong.n;

    var html = '';
    if (state.example) {
      html += '<div class="notice example"><p><strong>This is an example.</strong> These are a made-up person\'s answers, generated to show what the results look like.</p>' +
        '<div class="btn-row"><button class="btn primary" type="button" data-action="start">Take the test yourself</button>' +
        '<button class="btn" type="button" data-action="home">Back to the start</button></div></div>';
    }
    if (state.imported) {
      html += '<p class="notice small">Showing saved results from a file (session ' + esc(session.id || 'unnamed') + ').</p>';
    }
    var cond = session.condition || {};
    var conditionNote = 'The checker showed ' + (ADVICE_LABELS[cond.advice] || ADVICE_LABELS.reason).toLowerCase() +
      (cond.assignment === 'random' ? ' (assigned at random)' : '') + ', with feedback ' + (cond.feedback ? 'on' : 'off') + '.';
    if (!s.complete) {
      html += '<p class="notice warn small">This session is not finished, so these results only cover the ' + s.n.total + ' messages that were answered.</p>';
    }
    html += '<section class="card profile-card fade-in" aria-labelledby="results-title">' +
      '<div><p class="eyebrow">Your reliance profile</p>' +
      '<h1 class="profile-label" id="results-title" tabindex="-1">' + esc(p.label) + '</h1>' +
      '<p class="lede">' + esc(p.summary) + '</p>' +
      '<p>When the checker was right and you were not, you switched to its answer <strong>' + c.checkerRight.corrected + ' of ' + c.checkerRight.n + '</strong> times. ' +
      'When you were right and it was wrong, you held firm <strong>' + c.checkerWrong.heldFirm + ' of ' + c.checkerWrong.n + '</strong> times.</p>' +
      (p.tentative ? '<p class="notice warn small">This rests on only ' + decisive + (decisive === 1 ? ' moment' : ' moments') + ' where your first answer and the checker disagreed and one of you was right, so treat it as a hint rather than a verdict.</p>' : '') +
      '</div><div class="quadrant">' + quadrant(r.rair, r.rsr) +
      '<p class="legend" style="justify-content: center"><span><span class="swatch" style="background: var(--accent); border-radius: 50%"></span>' +
      (r.rair !== null && r.rsr !== null ? 'You' : (r.rair === null && r.rsr === null ? 'No position to show' : 'You are somewhere on the dashed line')) + '</span></p></div></section>';

    html += '<section class="stack" style="margin-top: 22px" aria-labelledby="scores-title">' +
      '<h2 id="scores-title">Scores at a glance</h2><div class="tiles">' +
      tile('Part 1, alone', a.before, s.correct.before, s.n.before) +
      tile('Your first answers', a.withInitial, s.correct.withInitial, s.n['with']) +
      tile('Checker alone', a.checker, s.correct.checker, s.n['with'], 'checker') +
      tile('Your final answers', a.withFinal, s.correct.withFinal, s.n['with']) +
      tile('Part 3, alone', a.after, s.correct.after, s.n.after) +
      '</div></section>';

    html += '<div class="grid-2" style="margin-top: 22px">' +
      '<section class="card" aria-labelledby="team-title"><h2 id="team-title">Did the checker help?</h2>' +
      '<p>' + esc(complementarityText(s)) + '</p>' +
      bars([
        { label: 'Your first answers', value: a.withInitial, detail: frac(s.correct.withInitial, s.n['with']) },
        { label: 'Checker alone', value: a.checker, detail: frac(s.correct.checker, s.n['with']), cls: 'checker' },
        { label: 'Your final answers', value: a.withFinal, detail: frac(s.correct.withFinal, s.n['with']), cls: 'final' }
      ]) +
      '<p class="small muted" style="margin-top: 10px">' + esc(conditionNote) + ' You changed ' + r.switches.total + ' of ' + s.n['with'] + ' answers after seeing the checker' +
      (r.disagreements ? ', and switched to its side in ' + r.switches.towardChecker + ' of the ' + r.disagreements + ' cases where you first disagreed.' : '.') + '</p></section>' +
      '<section class="card" aria-labelledby="moments-title"><h2 id="moments-title">The moments that mattered</h2>' +
      '<div class="matrix">' +
      cell('Checker right, you wrong', c.checkerRight.n ? c.checkerRight.corrected + ' of ' + c.checkerRight.n : 'none',
        c.checkerRight.n ? 'You switched to its right answer ' + pct(r.rair) + ' of the time.' : 'You were never wrong where it was right.', true, r.rair) +
      cell('You right, checker wrong', c.checkerWrong.n ? c.checkerWrong.heldFirm + ' of ' + c.checkerWrong.n : 'none',
        c.checkerWrong.n ? 'You kept your right answer ' + pct(r.rsr) + ' of the time.' : 'You were never right where it was wrong.', true, r.rsr) +
      cell('Both right', String(c.bothRight.n), 'Nothing to decide' + (c.bothRight.n - c.bothRight.finalRight ? ', though you talked yourself out of ' + (c.bothRight.n - c.bothRight.finalRight) + '.' : '.'), false) +
      cell('Both wrong', String(c.bothWrong.n), c.bothWrong.n ? 'The checker could not rescue these: it agreed with your mistake.' : 'You and the checker were never wrong together.', false) +
      '</div></section></div>';

    html += '<div class="grid-2" style="margin-top: 22px">' +
      '<section class="card" aria-labelledby="conf-title"><h2 id="conf-title">How sure were you?</h2>' +
      '<p class="small muted">The gap between how often you were right and how sure you felt. A long line means your confidence was a poor guide.</p>' +
      dumbbells(s.confidence) + '</section>' +
      '<section class="card" aria-labelledby="change-title"><h2 id="change-title">Before and after the checker</h2>' +
      changeText(s) + '</section></div>';

    html += '<section class="card" style="margin-top: 22px" aria-labelledby="replay-title"><h2 id="replay-title">What if you had used a simple rule?</h2>' +
      replaySection(s.replay, session.condition) + '</section>';

    html += '<section class="card" style="margin-top: 22px" aria-labelledby="trust-title"><h2 id="trust-title">Did your trust change after its first mistake?</h2>' +
      trustSection(s.trust, session.condition) + '</section>';

    html += '<section style="margin-top: 22px" aria-labelledby="debrief-title"><div class="section-title"><h2 id="debrief-title">Message by message</h2>' +
      '<span class="muted small">Open any message to see the warning signs.</span></div>' + debrief(session) + '</section>';

    html += '<section class="card" style="margin-top: 22px" aria-labelledby="save-title"><h2 id="save-title">Keep your results</h2>' +
      '<p class="small muted">The results file holds only your answers, confidence and timings. Researchers can pool many files with the Python toolkit that comes with this app.</p>' +
      '<div class="btn-row">' +
      '<button class="btn primary" type="button" data-action="download-json">Download results (JSON)</button>' +
      '<button class="btn" type="button" data-action="download-csv">Download answers (CSV)</button>' +
      '<button class="btn" type="button" data-action="restart">Take the test again</button></div></section>';

    app.innerHTML = html;
    focusFirst('results-title');
  }

  function ruleLabel(r) {
    if (r.key === 'first') { return 'Always keep your first answer'; }
    if (r.key === 'checker') { return 'Always go with the checker'; }
    if (r.key === 'unsure') { return 'Go with the checker only when you were ' + r.threshold + '% sure or less'; }
    return 'Go with the checker only when it was ' + r.threshold + '% confident or more';
  }

  function bestOf(rules, key) {
    var best = null;
    rules.forEach(function (r) { if (r.key === key && (best === null || r.correct > best.correct)) { best = r; } });
    return best;
  }

  function replaySection(rp, condition) {
    if (!rp.n) { return '<p>No checker messages were answered.</p>'; }
    var best = rp.best, actual = rp.actual.correct;
    var text;
    if (best.correct > actual) {
      text = 'In hindsight, the best simple rule for you was: <strong>' + esc(ruleLabel(best).toLowerCase()) + '</strong>. It would have scored ' +
        best.correct + ' of ' + rp.n + ', against your ' + actual + '.';
    } else if (best.correct === actual) {
      text = 'None of the simple rules beat what you actually did (' + actual + ' of ' + rp.n + ').';
    } else {
      text = 'You did better than every simple rule: ' + actual + ' of ' + rp.n + ', against at most ' + best.correct + '.';
    }
    var unsure = bestOf(rp.rules, 'unsure'), confident = bestOf(rp.rules, 'confident');
    var hidden = condition && condition.advice === 'verdict';
    var rows = [
      { label: 'What you actually did', value: rp.actual.accuracy, detail: '(' + actual + ' of ' + rp.n + ')', cls: 'final' },
      { label: 'Always keep your first answer', value: rp.rules[0].accuracy, detail: '(' + rp.rules[0].correct + ')' },
      { label: 'Always go with the checker', value: rp.rules[1].accuracy, detail: '(' + rp.rules[1].correct + ')', cls: 'checker' },
      { label: 'Only when you were ' + unsure.threshold + '% sure or less', value: unsure.accuracy, detail: '(' + unsure.correct + ')' },
      { label: 'Only when it was ' + confident.threshold + '% confident or more' + (hidden ? ' (hidden from you)' : ''), value: confident.accuracy, detail: '(' + confident.correct + ')', cls: 'checker' }
    ];
    var table = '<details class="all-rules"><summary>All ' + rp.rules.length + ' rules</summary><div class="scroll"><table class="data"><thead><tr><th scope="col">Rule</th><th scope="col">Right</th><th scope="col">Switches</th></tr></thead><tbody>' +
      rp.rules.map(function (r) {
        return '<tr' + (r === best ? ' class="best"' : '') + '><td>' + esc(ruleLabel(r)) + '</td><td>' + r.correct + ' of ' + rp.n + '</td><td>' + r.switched + '</td></tr>';
      }).join('') + '</tbody></table></div></details>';
    return '<p>' + text + '</p>' + bars(rows, true) +
      '<p class="small muted" style="margin-top: 10px">Each rule starts from your own first answers and only changes the ones where you disagreed with the checker. ' +
      'Picking the best rule after seeing the answers flatters it, so treat this as a clue about where your judgement and the checker\'s are strongest, not a proven strategy. ' +
      'The Python toolkit tests the same rules across many people.</p>' + table;
  }

  function trustSection(trust, condition) {
    if (!trust.timeline.length) { return '<p>No checker messages were answered.</p>'; }
    var cells = trust.timeline.map(function (x, i) {
      var label = 'Checker message ' + (i + 1) + ': checker ' + (x.checkerRight ? 'right' : 'wrong') + ', you ' +
        (x.disagreed ? 'first disagreed and ' + (x.followed ? 'switched' : 'held your answer') : 'agreed from the start' + (x.followed ? '' : ' but then changed'));
      return '<li class="tl-cell' + (x.checkerRight ? '' : ' tl-err') + (i + 1 === trust.firstErrorAt ? ' tl-first' : '') + '">' +
        '<span class="tl-ai" aria-hidden="true">' + (x.checkerRight ? '\u2713' : '\u2717') + '</span>' +
        '<span class="tl-you ' + (x.disagreed ? (x.followed ? 'switched' : 'held') : 'agreed') + '" aria-hidden="true"></span>' +
        '<span class="visually-hidden">' + esc(label) + '</span></li>';
    }).join('');
    var b = trust.beforeFirstError, a = trust.afterFirstError;
    var text;
    if (trust.firstErrorAt === null) {
      text = 'The checker had not made a mistake by the time you stopped.';
    } else {
      text = 'Its first mistake was checker message ' + trust.firstErrorAt + '. ' +
        (b.disagreements ? 'Before that, when you first disagreed with it, you switched to its answer in ' + b.switched + ' of ' + b.disagreements + (b.disagreements === 1 ? ' case. ' : ' cases. ') :
          'Before that, you never disagreed with it. ') +
        (a.disagreements ? 'After it, you switched in ' + a.switched + ' of ' + a.disagreements + '.' : 'After it, you never disagreed with it.');
      if (trust.change !== null) {
        text += trust.change <= -0.2 ? ' You leaned on it less once it had slipped up.' :
          trust.change >= 0.2 ? ' You leaned on it more as the test went on.' : ' Your trust in it stayed about the same.';
      }
      if (!condition.feedback) {
        text += ' You were not told when it was wrong, so any change came from your own judgement of its advice.';
      }
    }
    return '<p>' + esc(text) + '</p><ol class="timeline" aria-label="Each checker message in order">' + cells + '</ol>' +
      '<div class="legend"><span><span class="swatch tl-key switched"></span>First disagreed, then switched</span>' +
      '<span><span class="swatch tl-key held"></span>First disagreed, kept your answer</span>' +
      '<span><span class="swatch tl-key agreed"></span>Agreed from the start</span>' +
      '<span><span class="tl-key-x">\u2717</span> Checker wrong</span></div>';
  }

  function frac(k, n) { return n ? '(' + k + ' of ' + n + ')' : ''; }

  function tile(label, value, k, n, cls) {
    return '<div class="tile' + (cls ? ' ' + cls : '') + '"><div class="k">' + esc(label) + '</div>' +
      '<div class="v">' + pct(value) + '</div><div class="d">' + (n ? k + ' of ' + n + ' right' : 'not answered') + '</div></div>';
  }

  function cell(title, big, text, key, value) {
    var tone = key && value !== null && value !== undefined ? (value >= 0.5 ? ' good' : ' bad') : '';
    return '<div class="cell' + (key ? ' key' : '') + tone + '"><div class="small muted">' + esc(title) + '</div>' +
      '<div class="big">' + esc(big) + '</div><div class="small">' + esc(text) + '</div></div>';
  }

  function changeText(s) {
    if (s.change === null) { return '<p>Not enough answers in both solo parts to compare.</p>'; }
    var a = s.accuracy;
    var line = 'On your own you got ' + pct(a.before) + ' right before working with the checker and ' + pct(a.after) + ' after (' + points(s.change) + ').';
    return '<p>' + esc(line) + '</p>' +
      '<p class="small muted">The two solo parts use matched pairs of messages of similar difficulty, so the comparison is fair, but six messages each is a small sample: a change of one message is about 17 points. Pooled across many people, this is how an experiment would test whether an AI helper sharpens or blunts people\'s own judgement.</p>';
  }

  function debrief(session) {
    return session.trials.map(function (t) {
      var item = M.ITEM_BY_ID[t.item];
      if (!item) { return ''; }
      var done = M.isComplete(t);
      var finalAnswer = done ? (t.phase === 'with' ? t.final.answer : t.initial.answer) : null;
      var right = finalAnswer === t.truth;
      var summary = '<span class="pos">' + t.position + '</span><span class="grow"><strong>' + esc(item.topic) + '</strong> <span class="muted small">' +
        esc(CHANNEL_LABEL[item.channel]) + ', ' + esc(PHASE_INFO[t.phase].title.toLowerCase()) + '</span></span>' +
        answerChip(t.truth) +
        (done ? '<span class="chip ' + (right ? 'right' : 'wrong') + '">' + (right ? 'You were right' : 'You were wrong') + '</span>' : '<span class="chip neutral">Not answered</span>');
      var body = renderMessage(item, null, null);
      var yours = '';
      if (done) {
        if (t.phase === 'with') {
          yours = '<p style="margin-top: 12px">First answer ' + answerChip(t.initial.answer) + ' (' + t.initial.confidence + '% sure), checker ' +
            answerChip(t.ai.verdict) + ' (' + t.ai.confidence + '% confident), final answer ' + answerChip(t.final.answer) + ' (' + t.final.confidence + '% sure).</p>';
        } else {
          yours = '<p style="margin-top: 12px">Your answer ' + answerChip(t.initial.answer) + ' (' + t.initial.confidence + '% sure).</p>';
        }
      }
      return '<details class="debrief"><summary>' + summary + '</summary><div class="debrief-body">' + body + yours +
        '<strong>' + (t.truth === 'scam' ? 'Warning signs' : 'Why it is genuine') + '</strong><ul>' +
        item.cues.map(function (cue) { return '<li>' + esc(cue) + '</li>'; }).join('') + '</ul></div></details>';
    }).join('');
  }

  /* ---------- Actions ---------- */

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  function start() {
    state.session = M.buildSession(newSeed(), state.condition);
    state.index = 0; state.stage = 'initial'; state.imported = false; state.example = false;
    state.screen = 'phase';
    saveProgress();
    render();
  }

  function advance() {
    state.index++;
    state.stage = 'initial';
    if (state.index >= trials().length) { state.screen = 'results'; clearProgress(); }
    else {
      if (trials()[state.index].phase !== trials()[state.index - 1].phase) { state.screen = 'phase'; }
      saveProgress();
    }
    render();
  }

  function submitAnswer(form) {
    var err = document.getElementById('form-error');
    var answer = (form.querySelector('input[name="answer"]:checked') || {}).value;
    var conf = Number((form.querySelector('input[name="confidence"]:checked') || {}).value);
    if (!answer) {
      err.textContent = 'Choose Scam or Genuine first.';
      document.getElementById('answer-scam').focus();
      return;
    }
    if (!conf) {
      err.textContent = 'Choose how sure you are, from 50% (a guess) to 100% (certain).';
      document.getElementById('conf-50').focus();
      return;
    }
    var trial = current();
    var response = { answer: answer, confidence: conf, ms: Math.round(performance.now() - state.shownAt) };
    if (state.stage === 'initial') {
      trial.initial = response;
      if (trial.phase === 'with') { state.stage = 'final'; saveProgress(); render(); return; }
    } else {
      trial.final = response;
      if (state.session.condition.feedback) { state.stage = 'feedback'; saveProgress(); render(); return; }
    }
    advance();
  }

  function importFile(file) {
    var err = document.getElementById('import-error');
    var reader = new FileReader();
    reader.onload = function () {
      var obj;
      try { obj = JSON.parse(String(reader.result)); }
      catch (e) { err.textContent = 'That file is not valid JSON, so it cannot be opened.'; return; }
      var problems = M.validateSession(obj);
      if (problems.length) { err.textContent = problems.join(' '); return; }
      var unknown = obj.trials.filter(function (t) { return !M.ITEM_BY_ID[t.item]; });
      if (unknown.length) { err.textContent = 'The file refers to messages this version does not know.'; return; }
      obj.condition = obj.condition || { advice: 'reason', feedback: false };
      state.session = obj; state.imported = true; state.example = false; state.screen = 'results';
      render();
    };
    reader.onerror = function () { err.textContent = 'The file could not be read.'; };
    reader.readAsText(file);
  }

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) { return; }
    var action = btn.getAttribute('data-action');
    if (action === 'start') { start(); }
    else if (action === 'begin') { state.screen = 'trial'; render(); }
    else if (action === 'next') { advance(); }
    else if (action === 'example') {
      state.session = JSON.parse(JSON.stringify(EXAMPLE));
      state.example = true; state.imported = false; state.screen = 'results';
      render();
    } else if (action === 'resume') {
      var saved = loadProgress();
      if (saved) {
        state.session = saved.session; state.index = saved.index; state.stage = saved.stage;
        state.imported = false; state.example = false; state.screen = 'trial';
      }
      render();
    } else if (action === 'discard') { clearProgress(); render(); }
    else if (action === 'home') { state.screen = 'start'; render(); }
    else if (action === 'import') { document.getElementById('import-file').click(); }
    else if (action === 'download-json') {
      download('second-opinion-' + state.session.id + '.json', JSON.stringify(state.session, null, 2) + '\n', 'application/json');
    } else if (action === 'download-csv') {
      download('second-opinion-' + state.session.id + '.csv', M.sessionToCsv(state.session), 'text/csv');
    } else if (action === 'restart') { start(); }
  });

  app.addEventListener('toggle', function (e) {
    if (e.target.classList && e.target.classList.contains('settings')) { state.settingsOpen = e.target.open; }
  }, true);

  app.addEventListener('change', function (e) {
    if (e.target.name === 'advice-style') { state.condition.advice = e.target.value; }
    if (e.target.id === 'feedback-toggle') { state.condition.feedback = e.target.checked; }
    if (e.target.id === 'import-file' && e.target.files && e.target.files[0]) { importFile(e.target.files[0]); }
    if (e.target.name === 'answer' || e.target.name === 'confidence') {
      var err = document.getElementById('form-error');
      if (err) { err.textContent = ''; }
    }
  });

  app.addEventListener('submit', function (e) {
    e.preventDefault();
    submitAnswer(e.target);
  });

  document.addEventListener('keydown', function (e) {
    if (state.screen !== 'trial' || e.altKey || e.ctrlKey || e.metaKey) { return; }
    if (state.stage === 'feedback') {
      var tagName = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === 'Enter' && tagName !== 'BUTTON' && tagName !== 'A') { e.preventDefault(); advance(); }
      return;
    }
    var form = document.getElementById('answer-form');
    if (!form) { return; }
    var key = e.key.toLowerCase();
    var target = null;
    if (key === 's') { target = document.getElementById('answer-scam'); }
    else if (key === 'g') { target = document.getElementById('answer-genuine'); }
    else if (/^[1-6]$/.test(key)) { target = document.getElementById('conf-' + M.CONFIDENCE_LEVELS[Number(key) - 1]); }
    if (target) {
      e.preventDefault();
      target.checked = true;
      target.dispatchEvent(new Event('change', { bubbles: true }));
      return;
    }
    if (e.key === 'Enter') {
      // Buttons and links handle Enter themselves. Everywhere else, including
      // the radio buttons, Enter submits once (preventDefault stops the
      // browser's own implicit submission from firing a second time).
      var el = document.activeElement;
      var tag = (el && el.tagName) || '';
      if (tag === 'BUTTON' || tag === 'A' || tag === 'SUMMARY' || (tag === 'INPUT' && el.type !== 'radio')) { return; }
      e.preventDefault();
      submitAnswer(form);
    }
  });

  function render() {
    if (state.screen === 'start') { renderStart(); }
    else if (state.screen === 'phase') { renderPhase(); }
    else if (state.screen === 'trial') { renderTrial(); }
    else { renderResults(); }
    window.scrollTo(0, 0);
  }

  render();
})();
</script>
</body>
</html>
